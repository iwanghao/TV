import com.android.build.api.artifact.SingleArtifact
import com.fongmi.gradle.AbiApkPackaging

plugins {
    alias libs.plugins.android.application
}

def localProps = new Properties()
rootProject.file('local.properties').withInputStream {
    localProps.load(it)
}

// 唯一合法的打包证书：D:\密钥\haoiyu1.keystore（别名 haoiyu）。
// 证书指纹与 SignatureGuard.EXPECTED_SHA256 必须保持一致，否则装的包会被运行时校验拒绝。
def KEYSTORE_NAME = 'haoiyu1.keystore'
def KEYSTORE_ALIAS = 'haoiyu'
def KEYSTORE_SHA256 = 'd2f569ec0d8facb3d2996161a1699adf8df92d063c945be27388de48795265f0'

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.haoiyu.android.tv"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 572
        versionName "5.7.2"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["device"]

    productFlavors {
        leanback {
            dimension "device"
        }
        mobile {
            dimension "device"
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        release {
            // release 只允许使用 haoiyu1.keystore 签名，与运行时 SignatureGuard 的校验基准一致。
            // 缺少任何一项直接中断构建：静默回退 debug 会产出"看起来正常、实际证书不对"的包，
            // 且 AbiApkPackaging 的 FinalizeApksTask 会读取本配置二次签名，兜底值会覆盖向导里选的证书。
            def required = ['storeFile', 'keyAlias', 'storePassword']
            def missing = required.findAll { localProps[it] == null || localProps[it].toString().trim().isEmpty() }
            if (!missing.isEmpty()) {
                throw new GradleException(
                        "缺少签名配置：${missing.join(', ')}。\n" +
                        "请在 local.properties 中补全后再构建 release，例如：\n" +
                        "  storeFile=<keystore 绝对路径，中文需写成 \\\\uXXXX 转义>\n" +
                        "  keyAlias=<别名>\n" +
                        "  storePassword=<口令>\n" +
                        "（本项目禁止回退 debug 签名）")
            }
            storeFile file(localProps['storeFile'])
            keyAlias localProps['keyAlias']
            keyPassword localProps['storePassword']
            storePassword localProps['storePassword']

            // 校验指向的确实是 haoiyu1.keystore，防止"随便换一个 keystore 也能过"。
            // 只需文件可读即可比对指纹，不涉及私钥。
            def ks = file(localProps['storeFile'])
            if (!ks.exists()) {
                throw new GradleException("签名证书不存在：${ks.absolutePath}")
            }
            if (ks.name != KEYSTORE_NAME) {
                throw new GradleException("禁止使用其他证书打包：当前为 ${ks.name}，只允许 ${KEYSTORE_NAME}")
            }
            if (localProps['keyAlias'].toString().trim() != KEYSTORE_ALIAS) {
                throw new GradleException("keyAlias 必须为 ${KEYSTORE_ALIAS}，当前为 ${localProps['keyAlias']}")
            }
            def actualSha256 = new java.io.FileInputStream(ks).withCloseable { input ->
                def store = java.security.KeyStore.getInstance(ks.name.endsWith('.jks') ? 'JKS' : 'PKCS12')
                store.load(input, localProps['storePassword'].toString().toCharArray())
                def cert = store.getCertificate(localProps['keyAlias'].toString().trim())
                if (cert == null) throw new GradleException("证书别名不存在：${localProps['keyAlias']}")
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded)
                digest.collect { String.format('%02x', it) }.join()
            }
            if (actualSha256 != KEYSTORE_SHA256) {
                throw new GradleException(
                        "签名证书指纹不匹配：\n  期望 ${KEYSTORE_SHA256}\n  实际 ${actualSha256}\n" +
                        "该证书与运行时 SignatureGuard 的校验基准不一致，打出的包会闪退。")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

AbiApkPackaging.configure(project, SingleArtifact.APK.INSTANCE)

dependencies {
    // 定制版 media3 以 AAR 形式接入：源码位于 D:\StudioProjects\media-fongmi（分支 fongmi-1.11.0），
    // 构建产物 libraries/*/buildout/outputs/lib-*-release.aar 重命名为 media3-*.aar 后放入 app/libs，
    // 由下面的 fileTree 自动引入，无需在版本目录中声明。
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation libs.appcompat
    implementation libs.lifecycle.service
    implementation libs.media
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.android.gif.drawable
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.rtmp.client
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
    implementation libs.textdrawable
    leanbackImplementation libs.leanback
    leanbackImplementation libs.androidautosize
    mobileImplementation libs.biometric
    mobileImplementation libs.zxing.android.embedded
    annotationProcessor libs.room.compiler
    annotationProcessor libs.eventbus.annotation.processor
    annotationProcessor libs.glide.compiler
    coreLibraryDesugaring libs.desugar
}
